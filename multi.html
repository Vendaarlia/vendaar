<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project - Vendaar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #0a0a0f;
      color: #888;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .loader {
      width: 32px;
      height: 32px;
      border: 2px solid #1a1a2e;
      border-top-color: #6c5ce7;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { margin-top: 20px; font-size: 13px; color: #555; }
  </style>
</head>
<body>
  <div class="loader"></div>
  <p>Loading project&hellip;</p>

  <script>
    let redirected = false;
    const target = 'https://vendaar.top/project.html?slug=pm-panel-ds';

    function redirect() {
      if (redirected) return;
      redirected = true;
      window.location.replace(target);
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) redirect();
    });

    document.addEventListener('click', redirect, { once: true });
    document.addEventListener('touchstart', redirect, { once: true });
    document.addEventListener('scroll', redirect, { once: true });

    setTimeout(redirect, 3000);
  </script>
</body>
</html>
